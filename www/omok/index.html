<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- user-scalable=no: 아이가 두 손가락으로 판을 확대해버리면 착수가 어긋난다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1d12">
<title>오목</title>

<!-- 홈 화면에 추가했을 때 앱처럼 보이게 하는 설정.
     경로는 전부 상대경로다 — GitHub Pages처럼 하위 경로(/omok/)로 서빙돼도 그대로 동작한다. -->
<link rel="manifest" href="manifest.webmanifest">
<!-- apple-touch-icon이 없으면 iOS가 **페이지 스크린샷을 아이콘으로** 써버린다. -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="오목">
<!-- 표준은 mobile-web-app-capable이지만 iOS는 아직 apple- 접두사 쪽을 본다. 둘 다 둔다. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 상태바 아래까지 화면을 쓴다. 잘림은 CSS의 env(safe-area-inset-*)가 막는다. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-screen="menu">

  <!-- ── 메인 메뉴 ─────────────────────────────────────────────── -->
  <section class="screen screen-menu">
    <h1 class="logo">오목</h1>
    <p class="tagline">다섯 개를 먼저 이으면 이겨요</p>

    <div class="menu-buttons">
      <button class="btn btn-big" data-action="solo">혼자 하기</button>
      <button class="btn btn-big" data-action="duo">둘이 하기</button>
      <button class="btn btn-big btn-learn" data-action="lessons">배우기<small>오목 교실 · 쌍삼 사삼 배우기</small></button>
      <button class="btn btn-ghost" data-action="settings">설정</button>
    </div>

    <p class="record" id="record"></p>
  </section>

  <!-- ── 혼자 하기 설정 ────────────────────────────────────────── -->
  <section class="screen screen-solo">
    <h2 class="sub-title">혼자 하기</h2>

    <fieldset class="choice">
      <legend>얼마나 세게 할까요?</legend>
      <div class="choice-row" id="level-choice">
        <button class="chip" data-level="easy">쉬움<small>3을 만들면 이겨요</small></button>
        <button class="chip" data-level="normal">보통<small>쌍삼을 배우면 이겨요</small></button>
        <button class="chip" data-level="hard">어려움<small>실수하지 않아요</small></button>
      </div>
    </fieldset>

    <fieldset class="choice">
      <legend>누가 먼저 둘까요?</legend>
      <div class="choice-row" id="first-choice">
        <button class="chip" data-first="me"><span class="dot black"></span>내가 먼저</button>
        <button class="chip" data-first="ai"><span class="dot white"></span>컴퓨터 먼저</button>
      </div>
    </fieldset>

    <fieldset class="choice">
      <legend>코치가 도와줄까요?</legend>
      <div class="choice-row" id="coach-choice">
        <button class="chip" data-coach="on">코치와 함께<small>놓친 수를 알려줘요</small></button>
        <button class="chip" data-coach="off">혼자서<small>아무 말도 안 해요</small></button>
      </div>
    </fieldset>

    <div class="menu-buttons">
      <button class="btn btn-big" data-action="start-solo">시작!</button>
      <button class="btn btn-ghost" data-action="back-menu">뒤로</button>
    </div>
  </section>

  <!-- ── 게임 ──────────────────────────────────────────────────── -->
  <section class="screen screen-game">
    <header class="hud">
      <div class="turn" id="turn-label">
        <span class="dot black" id="turn-dot"></span>
        <span id="turn-text">내 차례</span>
      </div>
      <button class="btn-icon" data-action="back-menu" aria-label="메뉴로">✕</button>
    </header>

    <div class="board-wrap">
      <canvas id="board" aria-label="오목판"></canvas>
    </div>

    <footer class="controls">
      <button class="btn btn-sub" data-action="undo" id="btn-undo">무르기</button>
      <button class="btn btn-place" data-action="place" id="btn-place" disabled>여기 놓기</button>
      <button class="btn btn-sub" data-action="restart">다시</button>
    </footer>
  </section>

  <!-- ── 오목 교실: 레슨 목록 ────────────────────────────────────── -->
  <section class="screen screen-lessons">
    <header class="hud">
      <h2 class="sub-title hud-title">오목 교실</h2>
      <button class="btn-icon" data-action="back-menu" aria-label="메뉴로">✕</button>
    </header>
    <div class="lesson-scroll">
      <div class="lesson-list" id="lesson-list"></div>
      <h3 class="badge-title">내 배지</h3>
      <div class="badge-list" id="badge-list"></div>
      <p class="hint hint-center">실전(혼자 하기)에서 기술을 성공하면 배지가 생겨요</p>
    </div>
  </section>

  <!-- ── 오목 교실: 레슨 진행 (보기 → 찾기 → 써보기) ────────────────── -->
  <section class="screen screen-lesson">
    <header class="hud">
      <div class="lesson-head">
        <span class="lesson-name" id="lesson-name">레슨</span>
        <div class="lesson-steps" id="lesson-steps">
          <span data-part="demo">보기</span>
          <span data-part="puzzle">찾기</span>
          <span data-part="practice">써보기</span>
        </div>
      </div>
      <button class="btn-icon" data-action="back-lessons" aria-label="교실로">✕</button>
    </header>

    <div class="board-wrap">
      <canvas id="lesson-board" aria-label="연습판"></canvas>
    </div>

    <p class="bubble" id="lesson-bubble"></p>

    <footer class="controls">
      <button class="btn btn-sub" data-action="lesson-prev" id="btn-lesson-prev">이전</button>
      <button class="btn btn-sub" data-action="lesson-hint" id="btn-lesson-hint" hidden>힌트</button>
      <button class="btn btn-place" data-action="lesson-place" id="btn-lesson-place" hidden disabled>여기 놓기</button>
      <button class="btn btn-place" data-action="lesson-next" id="btn-lesson-next">다음</button>
    </footer>
  </section>

  <!-- ── 결과 ──────────────────────────────────────────────────── -->
  <div class="overlay" id="result-overlay" hidden>
    <div class="card">
      <p class="result-emoji" id="result-emoji">🎉</p>
      <h2 class="result-text" id="result-text">이겼다!</h2>
      <div class="menu-buttons">
        <button class="btn btn-big" data-action="restart">한 판 더</button>
        <button class="btn btn-ghost" data-action="back-lessons" id="btn-result-lessons" hidden>교실로</button>
        <button class="btn btn-ghost" data-action="back-menu">메뉴로</button>
      </div>
    </div>
  </div>

  <!-- ── 코치 — 판이 보이도록 아래쪽 시트로 뜬다 ───────────────────── -->
  <div class="sheet" id="coach-sheet" hidden>
    <div class="sheet-card">
      <p class="coach-text"><span class="coach-emoji">🧐</span> <span id="coach-text">잠깐!</span></p>
      <p class="hint">초록 동그라미 자리를 보세요</p>
      <div class="sheet-buttons">
        <button class="btn btn-big" data-action="coach-undo">무르기</button>
        <button class="btn btn-ghost" data-action="coach-keep">그냥 둘래요</button>
      </div>
    </div>
  </div>

  <!-- ── 설정 ──────────────────────────────────────────────────── -->
  <div class="overlay" id="settings-overlay" hidden>
    <div class="card">
      <h2 class="sub-title">설정</h2>
      <label class="toggle"><input type="checkbox" id="opt-sound"><span>소리</span></label>
      <label class="toggle"><input type="checkbox" id="opt-vibrate"><span>진동</span></label>
      <label class="toggle"><input type="checkbox" id="opt-instant"><span>한 번 눌러 바로 놓기</span></label>
      <p class="hint">끄면 두 번 눌러야 놓입니다. 잘못 짚어도 다시 고를 수 있어요.</p>
      <div class="menu-buttons">
        <button class="btn btn-big" data-action="close-settings">닫기</button>
        <button class="btn btn-ghost" data-action="reset-record">전적 지우기</button>
        <button class="btn btn-ghost" data-action="reset-lessons">교실 진행·배지 지우기</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div id="confetti" aria-hidden="true"></div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
