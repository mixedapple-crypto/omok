<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숫자숲 친구들</title>
<meta name="theme-color" content="#BFE4F5">
<!-- 홈 화면에 이 페이지를 직접 추가해도 iOS가 스크린샷을 아이콘으로 쓰지 않도록.
     매니페스트는 일부러 걸지 않는다 — 앱으로 설치하는 입구는 포털 하나로 둔다. -->
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root{
    --paper:#FFF6E8;      /* warm morning light */
    --meadow:#63B95D;     /* forest green */
    --meadow-deep:#3E8C4A;
    --coral:#FF8A5C;      /* action / buttons */
    --coral-deep:#E96F41;
    --sky:#BFE4F5;
    --ink:#41372A;        /* warm dark brown */
    --ink-soft:#8A7B66;
    --card:#FFFFFF;
    --hp-me:#63B95D;
    --hp-foe:#F26D6D;
    --gold:#F5B840;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',system-ui,sans-serif;
    min-height:100vh;
  }
  .stage-wrap{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--paper)}
  h1,h2,h3,.jua,button{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
  button{cursor:pointer;border:none;color:inherit;background:none;font-size:inherit}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:12px}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- screens ---------- */
  .screen{display:none;min-height:100vh;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- home ---------- */
  #scr-home{background:linear-gradient(180deg,var(--sky) 0%,#DFF0D8 30%,var(--paper) 60%)}
  .home-top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px}
  .logo{font-size:26px;color:var(--meadow-deep);text-shadow:0 2px 0 #fff}
  .chips{display:flex;gap:8px}
  .chip{background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 0 rgba(65,55,42,.12);display:flex;align-items:center;gap:4px}
  .chip .num{color:var(--ink)}
  .quest{margin:8px 16px 0;background:#FFF1D2;border:2px solid var(--gold);border-radius:14px;padding:8px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
  .quest .qt{font-family:'Jua';color:#B07A10;font-size:14px}
  .quest .q-row{display:flex;justify-content:space-between;gap:8px}
  .quest .q-row b{color:#B07A10;white-space:nowrap}
  .quest .q-row.done{color:var(--meadow-deep);text-decoration:none}
  .quest .q-row.done b{color:var(--meadow-deep)}
  .pet-house{display:flex;align-items:center;gap:14px;margin:12px 16px;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:0 3px 0 rgba(65,55,42,.10)}
  .pet-face{font-size:52px;line-height:1;filter:drop-shadow(0 3px 0 rgba(65,55,42,.15))}
  .pet-info{flex:1}
  .pet-name{font-size:18px;color:var(--meadow-deep)}
  .xpbar{height:10px;background:#EFE7D8;border-radius:6px;overflow:hidden;margin-top:6px}
  .xpbar>i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s}
  .pet-lv{font-size:12px;color:var(--ink-soft);margin-top:4px}
  .home-btns{display:flex;gap:10px;margin:0 16px 10px}
  .home-btns button{flex:1;background:var(--card);border-radius:14px;padding:10px 0;font-size:15px;color:var(--ink);box-shadow:0 3px 0 rgba(65,55,42,.10)}

  /* ---------- map ---------- */
  .map{flex:1;overflow-y:auto;padding:8px 24px 90px}
  .zone{margin-top:18px}
  .zone-tag{display:inline-block;background:var(--zc,#63B95D);color:#fff;border-radius:999px;padding:4px 14px;font-size:15px;font-family:'Jua';box-shadow:0 2px 0 rgba(65,55,42,.15)}
  .zone-sub{font-size:12px;color:var(--ink-soft);margin:6px 0 10px 4px}
  .nodes{display:flex;flex-direction:column;gap:14px}
  .node{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;box-shadow:0 3px 0 rgba(65,55,42,.10);border:2px solid transparent;text-align:left;width:88%}
  .node:nth-child(even){align-self:flex-end}
  .node.current{border-color:var(--coral);animation:pulse 1.6s infinite}
  .node.locked{opacity:.45;filter:grayscale(.6)}
  .node .face{font-size:34px;width:44px;text-align:center}
  .node .t{flex:1}
  .node .t .nm{font-size:16px;font-family:'Jua'}
  .node .t .ds{font-size:12px;color:var(--ink-soft)}
  .node .st{font-size:20px}
  .node.boss{background:#FFF0E6;border-color:#F0B08E}
  .node.boss.current{border-color:var(--coral)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- battle ---------- */
  #scr-battle{background:linear-gradient(180deg,var(--sky) 0%,#E7F3DC 45%,var(--paper) 70%)}
  .battle-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
  .battle-top .stg{font-family:'Jua';color:var(--meadow-deep);font-size:16px}
  .btn-flee{font-size:13px;color:var(--ink-soft);background:var(--card);border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 rgba(65,55,42,.10)}
  .arena{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 26px 0;min-height:170px}
  .fighter{display:flex;flex-direction:column;align-items:center;gap:6px;width:44%}
  .fighter .face{font-size:72px;line-height:1.1;filter:drop-shadow(0 4px 0 rgba(65,55,42,.18));transition:transform .15s}
  .fighter .nm{font-family:'Jua';font-size:15px}
  .hpbar{width:100%;height:14px;background:#EFE7D8;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
  .hpbar>i{display:block;height:100%;border-radius:8px;transition:width .35s}
  .hp-me>i{background:var(--hp-me)}
  .hp-foe>i{background:var(--hp-foe)}
  .hptxt{font-size:12px;color:var(--ink-soft)}
  .foe-face.hit,.me-face.hit{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px) rotate(-4deg)}75%{transform:translateX(7px) rotate(4deg)}}
  .dmgfloat{position:absolute;font-family:'Jua';font-size:26px;pointer-events:none;animation:rise .8s forwards}
  @keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
  .streak{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-family:'Jua';color:var(--coral-deep);font-size:15px;background:#FFE9DD;padding:3px 12px;border-radius:999px;display:none}
  .qcard{margin:10px 16px 0;background:var(--card);border-radius:20px;padding:14px 16px 10px;box-shadow:0 4px 0 rgba(65,55,42,.10);text-align:center;position:relative}
  .tbar{height:10px;background:#EFE7D8;border-radius:6px;overflow:hidden;margin:0 8px 10px}
  .tbar>i{display:block;height:100%;width:100%;background:var(--meadow);border-radius:6px}
  .tbar>i.hurry{background:var(--coral-deep)}
  .qtext{font-family:'Jua';font-size:40px;letter-spacing:2px}
  .qtext .ans{display:inline-block;min-width:76px;border-bottom:4px solid var(--coral);color:var(--coral-deep);margin-left:6px}
  .hint{font-size:13px;color:#B07A10;background:#FFF3D6;border-radius:10px;padding:6px 10px;margin-top:8px;display:none}
  .msg{font-family:'Jua';font-size:15px;margin-top:6px;min-height:22px;color:var(--meadow-deep)}
  .pad{margin:10px auto 0;padding:0 16px 20px;width:100%;max-width:380px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{background:var(--card);border-radius:16px;font-size:28px;font-family:'Jua';padding:12px 0;box-shadow:0 4px 0 rgba(65,55,42,.14);transition:transform .06s}
  .pad button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(65,55,42,.14)}
  .pad .k-del{background:#F4E9D8;font-size:22px}
  .pad .k-paw{background:transparent;box-shadow:none;cursor:default;opacity:.35;font-size:22px}
  .foe-face.dodge{animation:dodge .4s}
  @keyframes dodge{50%{transform:translateX(20px) rotate(8deg)}}

  /* ---------- result ---------- */
  #scr-win,#scr-lose{align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(180deg,#FFF3D6,var(--paper))}
  .big-face{font-size:96px;line-height:1.2}
  .res-title{font-size:32px;color:var(--meadow-deep);margin-top:8px}
  .res-sub{color:var(--ink-soft);margin-top:6px;font-size:15px}
  .res-card{background:var(--card);border-radius:18px;padding:14px 22px;margin-top:16px;box-shadow:0 3px 0 rgba(65,55,42,.10);font-size:16px;line-height:1.9}
  .res-card b{color:#B07A10}
  .cta{margin-top:22px;background:var(--coral);color:#fff;font-size:20px;padding:14px 44px;border-radius:999px;box-shadow:0 5px 0 var(--coral-deep)}
  .cta.gray{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(65,55,42,.14);margin-top:12px;font-size:16px;padding:10px 32px}

  /* ---------- modals ---------- */
  .modal{position:fixed;inset:0;background:rgba(65,55,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.open{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:480px;max-height:86vh;border-radius:24px 24px 0 0;padding:18px 18px 26px;overflow-y:auto}
  .sheet h2{color:var(--meadow-deep);font-size:22px;display:flex;justify-content:space-between;align-items:center}
  .x{font-size:15px;color:var(--ink-soft);background:var(--card);border-radius:999px;padding:4px 12px;box-shadow:0 2px 0 rgba(65,55,42,.10)}
  .dex{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  .dex .d{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 0 rgba(65,55,42,.08)}
  .dex .d .f{font-size:34px}
  .dex .d .n{font-size:11px;margin-top:2px;color:var(--ink-soft)}
  .dex .d.no{opacity:.35;filter:grayscale(1)}
  .stat-tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  .stat-tbl th,.stat-tbl td{padding:8px 6px;border-bottom:1px solid #EDE4D3;text-align:left}
  .stat-tbl td.num,.stat-tbl th.num{text-align:right}
  .acc-good{color:var(--meadow-deep);font-weight:700}
  .acc-bad{color:#D14B4B;font-weight:700}
  .wrong-list{margin-top:10px;font-size:14px;line-height:2}
  .wrong-list span{display:inline-block;background:#FDE8E8;border-radius:8px;padding:1px 10px;margin:2px 4px 2px 0}
  .gate-in{font-size:22px;width:120px;text-align:center;border:2px solid #E4D9C4;border-radius:12px;padding:8px;font-family:inherit;background:var(--card);color:var(--ink)}
  .note{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.7}
</style>


</head>
<body>
<div class="stage-wrap">

  <!-- HOME -->
  <section class="screen active" id="scr-home">
    <div class="home-top">
      <h1 class="logo">🌳 숫자숲 친구들</h1>
      <div class="chips">
        <a class="chip" id="btn-portal" href="../" aria-label="게임 선택으로" style="text-decoration:none">🏠</a>
        <span class="chip">🐷 <span class="num" id="coin-chip">0</span>원</span>
        <button class="chip" id="btn-sound" aria-label="소리 켜고 끄기">🔊</button>
      </div>
    </div>
    <div class="quest">
      <div class="qt">🎯 용돈 퀘스트</div>
      <div class="q-row" id="qr1"></div>
      <div class="q-row" id="qr2"></div>
      <div class="q-row" id="qr3"></div>
    </div>
    <div class="pet-house">
      <div class="pet-face" id="pet-face">🐶</div>
      <div class="pet-info">
        <div class="pet-name" id="pet-name">콩이</div>
        <div class="xpbar"><i id="pet-xp" style="width:0%"></i></div>
        <div class="pet-lv" id="pet-lv">Lv.1</div>
      </div>
    </div>
    <div class="home-btns">
      <button id="btn-dex">📖 친구 도감</button>
      <button id="btn-parent">📊 부모님</button>
    </div>
    <div class="map" id="map"></div>
  </section>

  <!-- BATTLE -->
  <section class="screen" id="scr-battle">
    <div class="battle-top">
      <span class="stg" id="b-stage">1. 초록 들판</span>
      <button class="btn-flee" id="btn-flee">그만하기</button>
    </div>
    <div class="arena" id="arena" style="position:relative">
      <span class="streak" id="streak-badge">🔥 3연속! 크리티컬</span>
      <div class="fighter">
        <div class="face me-face" id="me-face">🐶</div>
        <div class="nm" id="me-name">콩이</div>
        <div class="hpbar hp-me"><i id="me-hp" style="width:100%"></i></div>
        <div class="hptxt num" id="me-hptxt"></div>
      </div>
      <div class="fighter">
        <div class="face foe-face" id="foe-face">🐰</div>
        <div class="nm" id="foe-name">토실이</div>
        <div class="hpbar hp-foe"><i id="foe-hp" style="width:100%"></i></div>
        <div class="hptxt num" id="foe-hptxt"></div>
      </div>
    </div>
    <div class="qcard">
      <div class="tbar"><i id="t-fill"></i></div>
      <div class="qtext num"><span id="q-body">7 + 8</span> = <span class="ans num" id="q-ans">&nbsp;</span></div>
      <div class="hint" id="q-hint"></div>
      <div class="msg" id="b-msg">문제를 풀면 콩이가 공격해!</div>
    </div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="k-paw" disabled aria-hidden="true">🐾</button><button data-k="0">0</button><button class="k-del" data-k="del">⌫</button>
    </div>
  </section>

  <!-- WIN -->
  <section class="screen" id="scr-win">
    <div class="big-face" id="w-face">🐻</div>
    <h2 class="res-title" id="w-title">이겼다!</h2>
    <div id="w-stars" style="font-size:34px;letter-spacing:4px;margin-top:4px"></div>
    <div class="res-sub" id="w-sub"></div>
    <div class="res-card" id="w-card"></div>
    <button class="cta" id="btn-next">다음 모험 ➜</button>
    <button class="cta gray" id="btn-home1">숲으로 돌아가기</button>
  </section>

  <!-- LOSE -->
  <section class="screen" id="scr-lose">
    <div class="big-face">🍀</div>
    <h2 class="res-title" style="color:var(--coral-deep)">아깝다!</h2>
    <div class="res-sub" id="l-sub">거의 다 이겼는데! 한 번 더 하면 이길 수 있어</div>
    <div class="res-card" id="l-card"></div>
    <button class="cta" id="btn-retry">다시 도전!</button>
    <button class="cta gray" id="btn-home2">숲으로 돌아가기</button>
  </section>

  <!-- DEX MODAL -->
  <div class="modal" id="m-dex"><div class="sheet">
    <h2>📖 친구 도감 <button class="x" data-close="m-dex">닫기</button></h2>
    <div class="dex" id="dex-grid"></div>
  </div></div>

  <!-- PARENT MODAL -->
  <div class="modal" id="m-parent"><div class="sheet">
    <h2>📊 부모님 페이지 <button class="x" data-close="m-parent">닫기</button></h2>
    <div id="p-gate" style="text-align:center;padding:18px 0">
      <p style="margin-bottom:10px">어른인지 확인할게요! <b class="num">17 × 23</b> = ?</p>
      <input class="gate-in num" id="gate-in" inputmode="numeric" maxlength="4" aria-label="정답 입력">
      <button class="x" id="gate-ok" style="margin-left:8px">확인</button>
      <p class="note" id="gate-msg"></p>
    </div>
    <div id="p-body" style="display:none"></div>
  </div></div>

</div>
<script>
'use strict';
/* ================= 순수 게임 로직 (node 테스트 가능) ================= */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function P(t,a,b,op){return {t:t,a:a,b:b,op:op,ans:op==='+'?a+b:a-b};}

var TYPES={
  A1 :'한자리+한자리 (받아올림 없음)',
  A1c:'한자리+한자리 (받아올림)',
  S1 :'한자리-한자리',
  S2t:'십몇-한자리 (받아내림)',
  A2 :'두자리+한자리 (받아올림 없음)',
  A2c:'두자리+한자리 (받아올림)',
  S2 :'두자리-한자리 (받아내림 없음)',
  S2b:'두자리-한자리 (받아내림)'
};

function genByType(t){
  var a,b,d,u;
  switch(t){
    case 'A1':  a=ri(1,8); b=ri(1,9-a); return P(t,a,b,'+');
    case 'A1c': a=ri(1,9); b=ri(Math.max(1,10-a),9); return P(t,a,b,'+');
    case 'S1':  a=ri(2,9); b=ri(1,a-1); return P(t,a,b,'-');
    case 'S2t': a=ri(11,18); b=ri(a%10+1,9); return P(t,a,b,'-');
    case 'A2':  d=ri(1,9); u=ri(0,8); a=d*10+u; b=ri(1,9-u); return P(t,a,b,'+');
    case 'A2c': d=ri(1,9); u=ri(1,9); a=d*10+u; b=ri(10-u,9); return P(t,a,b,'+');
    case 'S2':  d=ri(1,9); u=ri(1,9); a=d*10+u; b=ri(1,u); return P(t,a,b,'-');
    case 'S2b': d=ri(1,9); u=ri(0,8); a=d*10+u; b=ri(u+1,9); return P(t,a,b,'-');
  }
  return P('A1',1,1,'+');
}

/* 스테이지별 문제 유형 비율 */
var MIX={
  1:[['A1c',1]],
  2:[['A1c',1]],
  3:[['A1c',1]],
  4:[['A1c',1]],
  5:[['A1c',1]],
  6:[['S2t',.8],['A1c',.2]],
  7:[['S2t',.8],['A1c',.2]],
  8:[['S2t',.7],['A1c',.3]],
  9:[['S2t',.6],['A1c',.4]],
  10:[['S2t',.7],['A1c',.3]],
  11:[['A2c',.7],['A1c',.3]],
  12:[['A2c',.7],['S2t',.3]],
  13:[['A2c',.8],['S2t',.2]],
  14:[['A2c',.7],['S2t',.3]],
  15:[['A2c',.8],['S2t',.2]],
  16:[['S2t',.5],['A2c',.5]],
  17:[['A1c',.3],['S2t',.4],['A2c',.3]],
  18:[['S2t',.5],['A2c',.5]],
  19:[['A1c',.2],['S2t',.4],['A2c',.4]],
  20:[['A1c',.2],['S2t',.4],['A2c',.4]]
};

function pickType(stage){
  var mix=MIX[stage]||MIX[20], r=Math.random(), acc=0, i;
  for(i=0;i<mix.length;i++){acc+=mix[i][1]; if(r<acc) return mix[i][0];}
  return mix[mix.length-1][0];
}

/* 오답 풀에서 25% 확률로 복습 문제 출제 */
function makeProblem(stage,pool){
  if(pool && pool.length>0 && Math.random()<.25){
    var old=pool.shift();
    var p=P(old.t,old.a,old.b,old.op); p.review=true; return p;
  }
  return genByType(pickType(stage));
}

/* 일반: 최소 7번(전부 크리티컬이어도), 보스: 최소 11번 맞혀야 쓰러짐 (크리티컬 15 기준) */
function foeMaxHP(stage,isBoss){
  return isBoss?150+stage:90+stage;
}

/* ================= 레벨 곡선 =================
   Lv.N에 도달하는 데 드는 누적 경험치 = 2*(N-1)*(N+4)
   레벨 간 간격이 12 → 16 → 20 → 24 …로 4씩 벌어진다. 올라갈수록 어려워진다.
   Lv.8까지는 옛 곡선(레벨당 25 고정)보다 항상 싸다 — 이미 저장된 아이 데이터의
   레벨이 내려가 콩이가 퇴화하는 일이 없도록 일부러 맞춘 값이다. Lv.9부터 비싸진다. */
function xpForLevel(n){return 2*(n-1)*(n+4);}
function levelFromXp(xp){
  var n=1;
  /* 상한은 저장 데이터가 깨져 거대한 값이 들어와도 루프가 멈추게 하는 안전장치다 */
  while(n<999&&xpForLevel(n+1)<=xp)n++;
  return n;
}
function petFormFor(lv){
  var i;
  for(i=0;i<PET_FORMS.length;i++){if(lv>=PET_FORMS[i].minLv)return PET_FORMS[i];}
  return PET_FORMS[PET_FORMS.length-1];
}

  function baseTime(){

    $('w-title').textContent=newFriend?'마법이 풀렸어!':(missedRescue?'이겼다... 어라?':(a.boss?'승리!':'악당을 물리쳤다!'));
    $('w-sub').textContent=newFriend?('✨ '+a.n+'가 숫자숲 친구가 되었어요!'):(missedRescue?(a.n+'가 아직 마법에 걸려 있어! 한 번도 안 틀리고 이기면 풀릴 거야'):(a.boss?(a.n+'와 즐겁게 놀았어요'):('악당 '+a.n+'를 혼내줬어요')));
    $('w-stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
    if(got>0)lines+='🐷 용돈 +'+got+'원<br>';
    lines+='⭐ 경험치 +'+(B.corrects+5)+'<br>';
    var qi;
    for(qi=0;qi<questLines.length;qi++)lines+=questLines[qi]+'<br>';
    if(missedRescue)lines+='💫 별 ⭐⭐⭐로 다시 도전하면 친구가 돼!<br>';
    else if(stars<3)lines+='한 번도 안 틀리면 별 3개! 🌟<br>';
    if(newFriend)lines+='📖 친구 도감에 '+a.n+' 등록!';
    $('w-card').innerHTML=lines;
    /* 구출 실패 시엔 같은 보스 재도전 버튼으로 */
    nextTarget=missedRescue?B.stage:Math.min(20,S.cleared+1);
    $('btn-next').textContent=missedRescue?'한 번 더 도전! 💪':'다음 모험 ➜';
    $('btn-next').style.display=(S.cleared>=20&&!missedRescue)?'none':'inline-block';
    if(S.cleared>=20&&S.dex.length>=4){$('w-sub').textContent='시즌1 클리어! 네 친구를 모두 구해냈어요 🎊';}
    sWin();
    show('scr-win');
  }
  function lose(){
    stopTimer();
    var a=ANIMALS[B.stage-1];
    var pct=Math.round((1-B.foeHP/B.foeMax)*100);
    $('l-sub').textContent=a.n+' 체력을 '+pct+'%나 깎았어! 한 번 더 하면 이길 수 있어';
    $('l-card').innerHTML='맞힌 문제 <b class="num">'+B.corrects+'개</b> 💪<br>다시 도전하면 처음부터 체력 가득!';
    sLose(); save();
    show('scr-lose');
  }

  /* --- 도감 --- */
  function renderDex(){
    var g=$('dex-grid'); g.innerHTML='';
    var i;
    var fh=document.createElement('div');
    fh.style.cssText='grid-column:1/-1;font-family:Jua;color:var(--meadow-deep);font-size:16px';
    fh.textContent='✨ 구해낸 친구들';
    g.appendChild(fh);
    for(i=4;i<20;i+=5){
      var a=ANIMALS[i], has=S.dex.indexOf(i+1)>=0;
      var d=document.createElement('div');
      d.className='d'+(has?'':' no');
      d.innerHTML='<div class="f">'+(has?a.f:'❓')+'</div><div class="n">'+(has?a.n:'???')+'</div>';
      g.appendChild(d);
    }
    var vh=document.createElement('div');
    vh.style.cssText='grid-column:1/-1;font-family:Jua;color:var(--ink-soft);font-size:16px;margin-top:8px';
    vh.textContent='⚔️ 물리친 악당들';
    g.appendChild(vh);
    for(i=0;i<20;i++){
      if(ANIMALS[i].boss)continue;
      var a2=ANIMALS[i], beat=(i+1)<=S.cleared;
      var d2=document.createElement('div');
      d2.className='d'+(beat?'':' no');
      d2.innerHTML='<div class="f">'+(beat?a2.f:'❓')+'</div><div class="n">'+(beat?a2.n:'???')+'</div>';
      g.appendChild(d2);
    }
  }

  /* --- 부모님 페이지 --- */
  function renderParent(){
    var order=['A1c','S2t','A2c'];
    for(var k in S.stats){if(order.indexOf(k)<0&&S.stats[k]&&S.stats[k].a>0)order.push(k);}
    var html='<table class="stat-tbl"><tr><th>문제 유형</th><th class="num">푼 횟수</th><th class="num">정답률</th><th class="num">시간초과</th></tr>';
    var i;
    for(i=0;i<order.length;i++){
      var t=order[i], st=S.stats[t];
      if(!st||st.a===0){html+='<tr><td>'+TYPES[t]+'</td><td class="num">0</td><td class="num">-</td><td class="num">'+((st&&st.to)||0)+'</td></tr>';continue;}
      var acc=Math.round(st.c/st.a*100);
      var cls=acc>=80?'acc-good':(acc<60?'acc-bad':'');
      html+='<tr><td>'+TYPES[t]+'</td><td class="num">'+st.a+'</td><td class="num '+cls+'">'+acc+'%</td><td class="num">'+(st.to||0)+'</td></tr>';
    }
    html+='</table>';
    html+='<h3 style="margin-top:18px;font-size:16px">최근 틀린 문제</h3><div class="wrong-list">';
    if(S.wrongLog.length===0)html+='아직 없어요!';
    for(i=0;i<Math.min(12,S.wrongLog.length);i++){
      var w=S.wrongLog[i];
      html+='<span class="num">'+w.q+' → '+w.given+' (정답 '+w.ans+')</span>';
    }
    html+='</div><div style="margin-top:16px;background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>🐷 저금통 <b class="num">'+S.coins+'원</b></span><button class="x" id="btn-payout">용돈 지급 완료</button></div>';
    html+='<p class="note">· 틀린 문제는 다음 배틀에 "복습 문제"로 다시 나옵니다.<br>· 정답률 80% 이상 초록, 60% 미만 빨강.<br>· 타이머: 기본 4초, 연속 정답이 쌓이면 3.5→3→2.5→최소 2초 (시간 초과는 데미지 없이 재도전, 오답만 피격).<br>· 보스는 구역 4판을 전부 별 3개로 깨야 열리고, 보스전도 무실수(별 3개)로 이겨야 친구 구출.<br>· 시간초과가 많고 오답이 적으면 "알지만 느린" 상태 — 유창성 연습 단계입니다.<br>· 용돈: 승리 +1원(보스 +5원, 재도전 0원), 일일 퀘스트 20+20원, 주간 15승 30원 — 매일 다 하면 주당 약 300~330원.<br>· 용돈을 지급하셨으면 "용돈 지급 완료"를 눌러 0원으로 초기화하세요 (두 번 눌러 확인).</p>';
    $('p-body').innerHTML=html;
    var pb=$('btn-payout'), armed=false, armT=null;
    pb.addEventListener('click',function(){
      if(!armed){armed=true;pb.textContent='정말요? 한 번 더!';armT=setTimeout(function(){armed=false;pb.textContent='용돈 지급 완료';},3000);return;}
      clearTimeout(armT);S.coins=0;save();renderParent();renderHome();
    });
  }

  /* --- 이벤트 --- */
  $('pad').addEventListener('click',function(e){
    var k=e.target.getAttribute&&e.target.getAttribute('data-k');
    if(!k||!B||B.busy)return;
    if(k==='del'){B.input=B.input.slice(0,-1);renderInput();}
    else if(B.input.length<3){B.input+=k;onDigits();}
  });
  document.addEventListener('keydown',function(e){
    if(!$('scr-battle').classList.contains('active')||!B||B.busy)return;
    if(e.key>='0'&&e.key<='9'&&B.input.length<3){B.input+=e.key;onDigits();}
    else if(e.key==='Backspace'){B.input=B.input.slice(0,-1);renderInput();}
  });
  $('btn-flee').addEventListener('click',function(){stopTimer();renderHome();show('scr-home');});
  var nextTarget=1;
  function bossGateOK(stage){
    if(stage%5!==0||stage<=S.cleared)return true;
    var z=Math.floor((stage-1)/5),c=0,j;
    for(j=z*5+1;j<=z*5+4;j++){if(S.stars&&S.stars[j]===3)c++;}
    return c===4;
  }
  $('btn-next').addEventListener('click',function(){
    var nx=nextTarget||Math.min(20,S.cleared+1);
    if(bossGateOK(nx)){startBattle(nx);}
    else{renderHome();show('scr-home');}
  });
  $('btn-home1').addEventListener('click',function(){renderHome();show('scr-home');});
  $('btn-retry').addEventListener('click',function(){startBattle(B.stage);});
  $('btn-home2').addEventListener('click',function(){renderHome();show('scr-home');});
  $('btn-sound').addEventListener('click',function(){S.sound=!S.sound;save();$('btn-sound').textContent=S.sound?'🔊':'🔇';});
  $('btn-dex').addEventListener('click',function(){renderDex();$('m-dex').classList.add('open');});
  $('btn-parent').addEventListener('click',function(){
    $('p-gate').style.display='block';$('p-body').style.display='none';
    $('gate-in').value='';$('gate-msg').textContent='';
    $('m-parent').classList.add('open');
  });
  $('gate-ok').addEventListener('click',function(){
    if($('gate-in').value.trim()==='391'){
      $('p-gate').style.display='none';$('p-body').style.display='block';renderParent();
    }else{$('gate-msg').textContent='앗, 다시 계산해 보세요!';}
  });
  document.addEventListener('click',function(e){
    var c=e.target.getAttribute&&e.target.getAttribute('data-close');
    if(c)$(c).classList.remove('open');
  });

  /* --- 시작 --- */
  /* 홈(포털) 버튼: 정적 호스팅에서 상위 폴더의 포털로 이동. 아티팩트/로컬 파일에서는 숨김 */
  if(/claude|^file$/.test(location.hostname||'file')||location.protocol==='file:'){$('btn-portal').style.display='none';}
  load(); dailyCheck(); renderHome();
})();}

</script>

</body>
</html>
