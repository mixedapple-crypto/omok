<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 게임숲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* ===== 게임 링크는 아래 <a href="..."> 두 곳만 고치면 됩니다 ===== */
  :root{
    --paper:#FFF6E8; --meadow:#63B95D; --meadow-deep:#3E8C4A;
    --coral:#FF8A5C; --coral-deep:#E96F41; --sky:#BFE4F5;
    --ink:#41372A; --ink-soft:#8A7B66; --card:#FFFFFF; --gold:#F5B840;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{color-scheme:light}
  body{
    background:linear-gradient(180deg,var(--sky) 0%,#DFF0D8 40%,var(--paper) 75%);
    color:var(--ink); font-family:'Noto Sans KR',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .wrap{width:100%;max-width:440px;text-align:center}
  h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:34px;color:var(--meadow-deep);text-shadow:0 2px 0 #fff}
  .sub{color:var(--ink-soft);margin-top:6px;font-size:15px}
  .games{display:flex;flex-direction:column;gap:16px;margin-top:28px}
  a.game{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);
    background:var(--card);border-radius:22px;padding:18px 20px;text-align:left;
    box-shadow:0 5px 0 rgba(65,55,42,.13);border:3px solid transparent;
    transition:transform .08s;position:relative;
  }
  a.game:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(65,55,42,.13)}
  a.game:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
  .icon{font-size:52px;line-height:1;width:64px;text-align:center;filter:drop-shadow(0 3px 0 rgba(65,55,42,.15))}
  .t{display:flex;flex-direction:column;min-width:0}
  .t .nm{font-family:'Jua';font-size:22px}
  .t .ds{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .go{margin-left:auto;font-family:'Jua';font-size:22px;color:var(--coral-deep)}
  .badge{
    position:absolute;top:-10px;right:14px;background:var(--coral);color:#fff;
    font-family:'Jua';font-size:12.5px;padding:3px 12px;border-radius:999px;
    box-shadow:0 2px 0 var(--coral-deep);
  }
  .num1{border-color:#CBB9A0}
  .num2{border-color:var(--meadow)}
  footer{margin-top:26px;font-size:12px;color:var(--ink-soft)}
</style>
</head>
<body>
  <main class="wrap">
    <h1>🌳 우리집 게임숲</h1>
    <p class="sub">오늘은 어떤 놀이를 해볼까?</p>
    <nav class="games">
      <a class="game num1" href="./omok/">
        <span class="icon">⚫</span>
        <span class="t">
          <span class="nm">1. 오목</span>
          <span class="ds">다섯 개를 먼저 이으면 승리!</span>
        </span>
        <span class="go">▶</span>
      </a>
      <a class="game num2" href="./math/">
        <span class="badge">새로 나왔어!</span>
        <span class="icon">🐶</span>
        <span class="t">
          <span class="nm">2. 더하기 빼기</span>
          <span class="ds">숫자숲 친구들 — 악당을 물리치고 친구를 구하자</span>
        </span>
        <span class="go">▶</span>
      </a>
    </nav>
    <footer>즐겁게 놀고, 눈도 쉬어 가면서! 🍀</footer>
  </main>
</body>
</html>
