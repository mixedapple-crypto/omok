<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 게임숲</title>
<meta name="theme-color" content="#BFE4F5">
<link rel="manifest" href="manifest.webmanifest">
<!-- apple-touch-icon이 없으면 iOS가 **페이지 스크린샷을 아이콘으로** 써버린다. -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게임숲">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* ===== 게임 링크는 아래 <a href="..."> 두 곳만 고치면 됩니다 ===== */
  :root{
    --paper:#FFF6E8; --meadow:#63B95D; --meadow-deep:#3E8C4A;
    --coral:#FF8A5C; --coral-deep:#E96F41; --sky:#BFE4F5;
    --ink:#41372A; --ink-soft:#8A7B66; --card:#FFFFFF; --gold:#F5B840;
  }
  /* 같은 자리를 빠르게 두 번 누르면 iOS가 화면을 확대한다. 두 손가락 확대는 남기고
     더블탭 확대만 끈다 — 네 게임 모두 같은 규칙이다. */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html{color-scheme:light}
  body{
    background:linear-gradient(180deg,var(--sky) 0%,#DFF0D8 40%,var(--paper) 75%);
    color:var(--ink); font-family:'Noto Sans KR',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .wrap{width:100%;max-width:440px;text-align:center}
  h1{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;font-size:34px;color:var(--meadow-deep);text-shadow:0 2px 0 #fff}
  .sub{color:var(--ink-soft);margin-top:6px;font-size:15px}
  .games{display:flex;flex-direction:column;gap:16px;margin-top:28px}
  a.game{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);
    background:var(--card);border-radius:22px;padding:18px 20px;text-align:left;
    box-shadow:0 5px 0 rgba(65,55,42,.13);border:3px solid transparent;
    transition:transform .08s;position:relative;
  }
  a.game:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(65,55,42,.13)}
  a.game:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
  .icon{font-size:52px;line-height:1;width:64px;text-align:center;filter:drop-shadow(0 3px 0 rgba(65,55,42,.15))}
  .t{display:flex;flex-direction:column;min-width:0}
  .t .nm{font-family:'Jua';font-size:22px}
  .t .ds{font-size:13.5px;color:var(--ink-soft);margin-top:3px}
  .go{margin-left:auto;font-family:'Jua';font-size:22px;color:var(--coral-deep)}
  /* "새로 나왔어!" 딱지. 게임 카드 <a> 안 첫 줄에 <span class="badge">를 넣으면 붙는다. */
  .badge{
    position:absolute;top:-10px;right:14px;background:var(--coral);color:#fff;
    font-family:'Jua';font-size:12.5px;padding:3px 12px;border-radius:999px;
    box-shadow:0 2px 0 var(--coral-deep);
  }
  .num1{border-color:#CBB9A0}
  .num2{border-color:var(--meadow)}
  .num3{border-color:#E98A3C}
  .num4{border-color:#5D45D8}
  footer{margin-top:26px;font-size:12px;color:var(--ink-soft)}
  /* 새 버전 확인 줄. 아이 눈에 띄지 않게 작게, 부모가 찾으면 보이게. */
  .update{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center}
  /* 부모님 안내는 읽기 전용이라 관문을 두지 않는다. 숨기면 구구단 🔒 때처럼 부모도 못 찾는다. */
  .update .guide{font-size:12px;color:var(--ink-soft);background:var(--card);border:1.5px solid #E3D8C6;border-radius:999px;padding:4px 12px;text-decoration:none}
  .update button{font:inherit;font-size:12px;color:var(--ink-soft);background:var(--card);border:1.5px solid #E3D8C6;border-radius:999px;padding:4px 12px;cursor:pointer}
  .update button:active{transform:translateY(1px)}
  .update .ver{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <main class="wrap">
    <h1>🌳 우리집 게임숲</h1>
    <p class="sub">오늘은 어떤 놀이를 해볼까?</p>
    <nav class="games">
      <a class="game num1" href="./omok/">
        <span class="icon">⚫</span>
        <span class="t">
          <span class="nm">1. 오목</span>
          <span class="ds">다섯 개를 먼저 이으면 승리!</span>
        </span>
        <span class="go">▶</span>
      </a>
      <a class="game num2" href="./math/">
        <span class="icon">🐶</span>
        <span class="t">
          <span class="nm">2. 더하기 빼기</span>
          <span class="ds">숫자숲 친구들 — 악당을 물리치고 친구를 구하자</span>
        </span>
        <span class="go">▶</span>
      </a>
      <a class="game num3" href="./mul/">
        <span class="icon">🐟</span>
        <span class="t">
          <span class="nm">3. 곱셈 나눗셈</span>
          <span class="ds">곱셈 바다 — 세로셈으로 빈칸을 채우자</span>
        </span>
        <span class="go">▶</span>
      </a>
      <a class="game num4" href="./gugudan/">
        <span class="icon">🚀</span>
        <span class="t">
          <span class="nm">4. 구구단</span>
          <span class="ds">구구단 로켓 — 생각 없이 나올 때까지, 하루 7분</span>
        </span>
        <span class="go">▶</span>
      </a>
    </nav>
    <footer>
      즐겁게 놀고, 눈도 쉬어 가면서! 🍀
      <div class="update">
        <a class="guide" href="./guide/">📖 부모님 안내</a>
        <button id="btn-update" type="button">🔄 새 소식 확인</button>
        <span id="update-msg" aria-live="polite"></span>
        <span class="ver">버전 <span id="ver">__BUILD__</span></span>
      </div>
    </footer>
  </main>
<script>
  /*
   * 오프라인 지원. 실패해도 포털은 정상 동작하므로 조용히 넘어간다.
   * 경로는 상대경로여야 한다 — GitHub Pages가 하위 경로(/omok/)로 서빙한다.
   *
   * 새 버전 갱신. 포털 워커는 캐시 우선이라 배포 뒤 첫 실행에서는 옛 화면이 먼저 뜨고
   * 새 워커는 그 뒤에 설치된다. 그대로 두면 새 메뉴는 **두 번째 실행**부터 보인다.
   * 그래서 새 워커가 이 화면을 넘겨받는 순간(controllerchange) 한 번만 다시 불러온다.
   * 게임 화면에는 넣지 않는다 — 플레이 중에 화면이 튀면 안 된다. 게임 파일은 다음에
   * 포털을 거쳐 들어갈 때 새 워커가 준다.
   * ⚠️ 처음 설치할 때도 controllerchange가 온다. 그때는 넘겨받기 전부터 같은 화면이라
   * 다시 불러올 이유가 없고, 잘못 불러오면 무한 새로고침의 씨앗이 된다. 넘겨받기 전에
   * 워커가 있었는지(hadController)로 가른다.
   */
  var msgEl = document.getElementById('update-msg');
  var verEl = document.getElementById('ver');
  // 버전은 배포 시 CI가 커밋 SHA로 바꿔 넣는다(.github/workflows/pages.yml). 로컬에서는 자리표시자 그대로다.
  if (verEl.textContent.charAt(0) === '_') verEl.textContent = '개발판';
  function say(t) { msgEl.textContent = t; }

  var swOK = 'serviceWorker' in navigator
      && (location.protocol === 'https:' || location.hostname === 'localhost');
  if (swOK) {
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) return;
      reloading = true;
      say('새 버전을 받았어! 다시 여는 중…');
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function (err) {
        console.warn('[게임숲] 오프라인 지원 등록 실패(포털은 정상):', err);
      });
    });
  }

  /*
   * 부모용 확인 단추. 브라우저가 알아서 하는 새 버전 확인을 지금 당장 시키고 결과를 말로
   * 알려준다. 새 버전이 있으면 위의 controllerchange가 이어받아 화면을 다시 불러온다.
   * 캐시를 통째로 지우고 다시 받는 방식은 쓰지 않는다 — 오프라인이면 빈 화면이 된다.
   */
  document.getElementById('btn-update').addEventListener('click', function () {
    if (!swOK) { say('여기서는 저장 기능을 쓰지 않아'); return; }
    if (!navigator.onLine) { say('인터넷이 없어서 확인 못 했어'); return; }
    say('확인하는 중…');
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (!reg) { say('아직 저장된 게 없어. 한 번 더 열어 봐'); return; }
      // 오목 워커(./omok/)도 같이 확인시킨다. 이 화면을 맡은 워커가 아니라 여기서는 티가
      // 안 나지만, 다음에 오목에 들어갈 때 새 버전이 된다.
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { if (r !== reg) r.update().catch(function () {}); });
      });
      return reg.update().then(function () {
        if (reg.installing || reg.waiting) say('새 버전 받는 중…');
        else say('이미 최신이야');
      });
    }).catch(function () { say('인터넷이 없어서 확인 못 했어'); });
  });
</script>
</body>
</html>
