name: Deploy to GitHub Pages

# main에 push하면 테스트를 돌리고, 통과할 때만 배포한다.
# 테스트를 게이트로 두는 이유: 배포 대상이 아이가 실제로 쓰는 사이트라
# 깨진 상태가 올라가면 "아빠 게임 안 돼"로 돌아온다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 의존성이 0이라 설치 단계가 없다. npm test가 node를 직접 부른다.
      # 개수를 이름에 박지 않는다 — 테스트를 늘릴 때마다 라벨이 거짓말이 된다.
      - name: 단위 테스트
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 서비스 워커의 캐시 버전을 커밋 SHA로 박는다. 손으로 올리는 상수로 두면
      # 언젠가 깜빡하고, 그러면 아이 아이패드에 옛 버전이 영영 남는다.
      - name: 캐시 버전 주입
        run: |
          # 포털 화면(www/index.html)에도 같은 값을 박는다 — 부모가 기기가 최신인지 눈으로 확인하는 용도.
          for f in www/sw.js www/omok/sw.js www/index.html www/gugudan/sw.js; do
            sed -i "s/__BUILD__/${GITHUB_SHA::12}/" "$f"
            # 치환이 실제로 됐는지 확인한다. 자리표시자가 그대로 남으면 캐시 이름이
            # 배포마다 같아져서 기기에 옛 버전이 영영 박힌다 — 조용히 지나가면 안 된다.
            if grep -q "__BUILD__" "$f"; then
              echo "::error::$f 의 __BUILD__ 치환 실패"; exit 1
            fi
          done
          grep -n "const VERSION" www/sw.js www/omok/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # www/ 안의 것만 올린다. 테스트·문서·결정 원장은 사이트에 필요 없다.
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
